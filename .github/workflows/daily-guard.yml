name: Daily guard cycle

# Keeps Cordon demonstrably alive: executes real protective top-ups through
# KeeperHub every day and commits the receipts. The Actions tab is public —
# a judge can see the guardian still executing without anyone pressing a button.
#
# Disclosure: this scheduled run is the evidence campaign (CAMPAIGN_ESCALATE),
# not product guarding. The seed threshold is deliberately above the current
# health factor so the execute path is exercised; real guarding uses a fixed
# threshold and stands down when healthy. This is stated in the README and the
# BUIDL — nothing on the Actions tab is misleading.

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch: {} # manual trigger for demos

jobs:
  guard:
    name: Execute guard cycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci
        working-directory: harness
      - name: Execute guard cycles through KeeperHub
        working-directory: harness
        env:
          KH_API_KEY: ${{ secrets.KH_API_KEY }}
          POSITION_ADDRESS: ${{ secrets.POSITION_ADDRESS }}
          RESERVE: LINK
          TOP_UP_AMOUNT: "5"
          CAMPAIGN_ROUNDS: "6"
          CAMPAIGN_ESCALATE: "true"
          CHAIN_ID: "11155111"
        run: npm run campaign
      - name: Sync public evidence to site
        run: node harness/scripts/sync-public-evidence.mjs
      - name: Commit receipts
        run: |
          git config user.name "Sithu Nyein"
          git config user.email "sithunyein.mailto@gmail.com"
          git add harness/receipts/receipts.json public/receipts.json
          git commit -m "evidence: daily guard cycle ($(date -u +%F))" || echo "nothing to commit"
          git push
